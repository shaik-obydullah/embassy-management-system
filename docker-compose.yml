services:
  # Nginx Web Server
  embassy_nginx:
    image: nginx:alpine
    container_name: embassy_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - embassy_network
    depends_on:
      - embassy_container

  # Laravel Application
  embassy_container:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: embassy_container
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - embassy_app_storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=embassy_mysql
      - DB_PORT=3306
      - DB_DATABASE=embassy_db
      - DB_USERNAME=embassy_user
      - DB_PASSWORD=embassy_secret
      - REDIS_HOST=embassy_redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    networks:
      - embassy_network
    depends_on:
      - embassy_mysql
      - embassy_redis

  # MySQL Database
  embassy_mysql:
    image: mysql:8.0
    container_name: embassy_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: embassy_root_password
      MYSQL_DATABASE: embassy_db
      MYSQL_USER: embassy_user
      MYSQL_PASSWORD: embassy_secret
    volumes:
      - embassy_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - embassy_network

  # Redis
  embassy_redis:
    image: redis:alpine
    container_name: embassy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - embassy_redis_data:/data
    networks:
      - embassy_network

volumes:
  embassy_mysql_data:
  embassy_redis_data:
  embassy_app_storage:

networks:
  embassy_network:
    driver: bridge
